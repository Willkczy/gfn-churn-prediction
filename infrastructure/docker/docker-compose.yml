services:
  spark-dev-container:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: spark-dev-node
    networks:
      - app-network
    volumes:
      - ../../:/home/spark/work 
      - spark_cluster_data:/data
    depends_on:
      - db
      - spark-master
  
  spark-master:
    image: spark:3.5.6-scala2.12-java17-python3-ubuntu
    container_name: spark-master-node
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master --host spark-master-node
    ports:
      - "8080:8080"
      - "7077:7077"
    networks:
      - app-network
    volumes:
      - spark_cluster_data:/data

  spark-worker-1:
    image: spark:3.5.6-scala2.12-java17-python3-ubuntu
    container_name: spark-worker-node-1
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master-node:7077
    ports:
      - "8081:8081"
    networks:
      - app-network
    volumes:
      - spark_cluster_data:/data
    depends_on:
      - spark-master

  spark-worker-2:
    image: spark:3.5.6-scala2.12-java17-python3-ubuntu
    container_name: spark-worker-node-2
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master-node:7077
    ports:
      - "8082:8081"
    networks:
      - app-network
    volumes:
      - spark_cluster_data:/data

  db:
    image: postgres:latest
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: postgres
    networks:
      - app-network
    volumes:
      - pg_db_data:/var/lib/postgresql
    ports:
      - "5432:5432"
  
  pgadmin:
    image: dpage/pgadmin4:latest
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./servers.json:/pgadmin4/servers.json
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com  
      PGADMIN_DEFAULT_PASSWORD: password       
    ports:
      - "5050:80" 
    networks:
      - app-network
    depends_on:
      - db

networks:
  app-network:
    driver: bridge

volumes:
  pg_db_data:
  spark_cluster_data:
  pgadmin_data: