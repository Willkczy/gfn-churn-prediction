name: CI

on:
  push:
    branches:
      - develop
      - "feature/**"
      - "chore/**"
  pull_request:
    branches:
      - develop
      - "feature/**"
      - "chore/**"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync

      - name: Lint
        run: uv run ruff check src/ tests/

      - name: Unit tests
        run: uv run pytest -m "not data"
